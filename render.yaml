# Render 선언 파일(Phase 1). 비밀값은 여기에 적지 않고 대시보드에서 넣는다(sync: false).
services:
  - type: web
    name: todo-server
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: DATABASE_HOST
        sync: false
      - key: DATABASE_PORT
        value: '5432'
      - key: DATABASE_NAME
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: DATABASE_SSL
        value: 'true'
      - key: CORS_ALLOWED_ORIGINS
        sync: false
