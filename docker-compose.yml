# 로컬 개발용 PostgreSQL. 접속 정보는 로컬 전용 값이며 비밀값이 아니다.
services:
  postgres:
    image: postgres:18
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: todo
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
